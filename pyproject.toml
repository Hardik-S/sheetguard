[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetguard"
version = "0.1.0"
description = "Read-only checks for declared requirements in saved XLSX workbooks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "openpyxl>=3.1,<4"]

[project.scripts]
sheetguard = "sheetguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
